[package]
name = "gopher64"
version = "1.1.36"
edition = "2024"
rust-version = "1.98.1"

[features]
default = ["gui"]
standalone = [
    "dep:sevenz-rust2", "dep:mimalloc", "dep:matchbox_socket", "dep:ggrs",
    "dep:clap", "dep:reqwest", "dep:discord-rich-presence", "dep:rustls",
    "dep:dirs", "dep:sdl3-sys", "dep:sdl3-ttf-sys", "dep:jni", "dep:webpki-roots",
    "dep:sdl3-src", "dep:winresource",
    "tokio/process", "tokio/net", "tokio/io-util", "tokio/time", "tokio/macros",
]
gui = [
    "standalone", "dep:rfd", "dep:slint", "dep:open", "dep:slint-build",
    "dep:tokio-tungstenite", "dep:futures", "dep:semver", "dep:quick-xml", "dep:obfstr",
]
modloader = ["dep:modloader-abi"]

[[bin]]
name = "gopher64"
path = "src/main.rs"
required-features = ["standalone"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zip = "8.0"
sevenz-rust2 = { version = "0.23", optional = true }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-big-array = "0.5"
sha2 = "0.11"
tokio = { version = "1.46", features = ["rt-multi-thread", "fs", "sync"] }
spin_sleep = "1.3"
encoding_rs = "0.8"
mimalloc = { version = "0.1", optional = true }
modloader-abi = { path = "modloader-abi/rust", features = ["adapter", "n64"], optional = true }
regex = "1.11"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"], optional = true }
matchbox_socket = { version = "0.14", optional = true }
ggrs = { version = "0.13", features = ["sync-send"], optional = true }
rustc-hash = "2.1"
futures = { version = "0.3", optional = true }
rand = { version = "0.10", features = ["serde"] }
fatfs = "0.3"
semver = { version = "1.0", optional = true }
postcard = { version = "1.1", features = ["use-std"] }
clap = { version = "4.5", features = ["derive"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy", "json", "query"], optional = true }
discord-rich-presence = { version = "1.1", optional = true }
quick-xml = { version = "0.42", optional = true }
obfstr = { version = "0.4", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.16", default-features = false, features = ["compat-1-2", "std", "unstable-winit-030", "backend-winit", "renderer-femtovg-wgpu", "accessibility"], optional = true }
rfd = {version = "0.17", optional = true }
dirs = { version = "7.0", optional = true }
open = { version = "5.3", optional = true }
sdl3-sys = { version = "0.7", features = ["build-from-source-static"], optional = true }
sdl3-ttf-sys = { version = "0.7", features = ["build-static-vendored", "no-sdlttf-harfbuzz", "no-sdlttf-plutosvg"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.16", default-features = false, features = ["compat-1-2", "std", "backend-android-activity-06", "accessibility"], optional = true }
jni = { version = "0.22", optional = true }
sdl3-sys = { version = "0.7", features = ["build-from-source"], optional = true }
sdl3-ttf-sys = { version = "0.7", features = ["build-from-source", "no-sdlttf-harfbuzz", "no-sdlttf-plutosvg"], optional = true }
webpki-roots = { version = "1.0", optional = true }

[build-dependencies]
winresource = { version = "0.1", optional = true }
bindgen = "0.73"
sdl3-src = { version = "3.4", optional = true }
slint-build = { version = "1.12", optional = true }
cc = { version = "1.2", features = ["parallel"] }

[profile.release]
lto = "thin"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[package.metadata.bundle]
name = "Gopher64"
identifier = "io.github.gopher64.gopher64"
category = "public.app-category.games"
icon = ["data/icon/gopher64_128x128.png","data/icon/gopher64_256x256.png","data/icon/gopher64_512x512.png"]

[package.metadata.bundle.osx]
frameworks = ["/opt/homebrew/opt/molten-vk/lib/libMoltenVK.dylib"]
minimum_system_version = "15.0"
